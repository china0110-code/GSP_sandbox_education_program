<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理解度チェック — AI活用教育プログラム</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .quiz-wrap { max-width: 720px; margin: 0 auto; }

    /* ---- 問題カード ---- */
    .q-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px 36px;
      box-shadow: var(--sh);
      margin-bottom: 20px;
    }

    .q-num {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .q-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .q-opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: .88rem;
      color: var(--ink);
      transition: all .15s;
      line-height: 1.5;
    }

    .opt-label:hover { border-color: var(--ink-soft); background: var(--slate); }

    .opt-label input { display: none; }

    .opt-label.selected {
      border-color: var(--ink-soft);
      background: #eef2ff;
      font-weight: 700;
    }

    .opt-label.correct {
      border-color: var(--green);
      background: #f0fbf5;
      color: var(--green);
      font-weight: 700;
    }

    .opt-label.wrong {
      border-color: var(--red);
      background: #fff5f5;
      color: var(--red);
    }

    .opt-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--border);
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .opt-label.correct .opt-index { background: var(--green); color: #fff; }
    .opt-label.wrong   .opt-index { background: var(--red);   color: #fff; }
    .opt-label.selected .opt-index { background: var(--ink-soft); color: #fff; }

    .q-explanation {
      margin-top: 14px;
      padding: 12px 16px;
      background: var(--gold-pale);
      border: 1px solid rgba(184,146,42,.3);
      border-radius: var(--r-sm);
      font-size: .82rem;
      color: var(--ink-mid);
      line-height: 1.65;
      display: none;
    }

    .q-explanation.show { display: block; }

    /* ---- 進捗 ---- */
    .quiz-progress {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .quiz-progress-label {
      font-size: .82rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ---- 結果画面 ---- */
    .result-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 40px;
      box-shadow: var(--sh);
      text-align: center;
    }

    .result-icon { font-size: 3rem; margin-bottom: 16px; }

    .result-title {
      font-family: var(--ff-serif);
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-score {
      font-family: var(--ff-serif);
      font-size: 3rem;
      font-weight: 300;
      color: var(--ink-soft);
      line-height: 1;
      margin: 20px 0;
    }

    .result-desc { font-size: .87rem; color: var(--muted); margin-bottom: 28px; line-height: 1.7; }

    .result-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="topbar-logo">AI活用教育プログラム</a>
  <div class="topbar-nav">
    <span id="topbarCourse" style="font-size:.8rem;color:rgba(255,255,255,.5)"></span>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">ログアウト</button>
  </div>
</div>

<div class="page">
  <div class="quiz-wrap">

    <div class="au au1" id="quizHeader">
      <div class="loading"><div class="spinner"></div>読み込み中…</div>
    </div>

    <div id="quizBody"></div>

  </div>
</div>

<script type="module">
  import { requireAuth, logout } from "./auth.js";
  import { saveQuizResult, completeCourse } from "./db.js";

  let profile  = null;
  let course   = null;
  let questions = [];
  let answers  = {};   // { questionId: selectedIndex }
  let submitted = false;

  async function init() {
    profile = await requireAuth();

    const params   = new URLSearchParams(location.search);
    const courseId = params.get('id');
    if (!courseId) { location.href = 'dashboard.html'; return; }

    const [courses, quizzes] = await Promise.all([
      fetch('./data/courses-meta.json').then(r => r.json()),
      fetch('./data/quizzes.json').then(r => r.json()),
    ]);

    course = courses.find(c => c.id === courseId);
    const quizDef = quizzes.find(q => q.courseId === courseId);

    if (!course || !quizDef) { location.href = `course.html?id=${courseId}`; return; }

    questions = quizDef.questions;

    document.title = `理解度チェック：${course.title} — AI活用教育プログラム`;
    document.getElementById('topbarCourse').textContent = course.title;

    renderHeader();
    renderQuiz();
  }

  function renderHeader() {
    document.getElementById('quizHeader').innerHTML = `
      <div class="page-title">理解度チェック</div>
      <div class="page-sub">${course.title} ／ 全${questions.length}問 ／ 合格基準 ${course.passingScore}%</div>
    `;
  }

  function renderQuiz() {
    const pct = Math.round(Object.keys(answers).length / questions.length * 100);

    document.getElementById('quizBody').innerHTML = `
      <div class="quiz-progress au">
        <span class="quiz-progress-label">${Object.keys(answers).length} / ${questions.length} 回答済み</span>
        <div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>

      ${questions.map((q, qi) => `
      <div class="q-card au" style="animation-delay:${qi * .05}s">
        <div class="q-num">問 ${qi + 1}</div>
        <div class="q-text">${q.text}</div>
        <div class="q-opts" id="opts-${q.id}">
          ${q.options.map((opt, oi) => `
          <label class="opt-label ${answers[q.id] === oi ? 'selected' : ''}"
                 id="opt-${q.id}-${oi}"
                 onclick="selectAnswer('${q.id}', ${oi}, ${qi})">
            <input type="radio" name="${q.id}" value="${oi}" ${answers[q.id] === oi ? 'checked' : ''}>
            <span class="opt-index">${String.fromCharCode(65 + oi)}</span>
            <span>${opt}</span>
          </label>`).join('')}
        </div>
        <div class="q-explanation" id="exp-${q.id}">
          💡 ${q.explanation}
        </div>
      </div>`).join('')}

      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-gold" id="submitBtn"
          onclick="submitQuiz()"
          ${Object.keys(answers).length < questions.length ? 'disabled' : ''}>
          採点する（${Object.keys(answers).length}/${questions.length}問回答済み）
        </button>
      </div>
    `;
  }

  window.selectAnswer = function(qid, optIndex, qi) {
    if (submitted) return;
    answers[qid] = optIndex;

    /* 選択状態を更新 */
    document.querySelectorAll(`#opts-${qid} .opt-label`).forEach((el, i) => {
      el.classList.toggle('selected', i === optIndex);
    });

    /* 採点ボタン更新 */
    const btn = document.getElementById('submitBtn');
    const answered = Object.keys(answers).length;
    btn.disabled = answered < questions.length;
    btn.textContent = `採点する（${answered}/${questions.length}問回答済み）`;

    /* 進捗バー更新 */
    const pct = Math.round(answered / questions.length * 100);
    document.querySelector('.prog-fill').style.width = `${pct}%`;
    document.querySelector('.quiz-progress-label').textContent = `${answered} / ${questions.length} 回答済み`;
  };

  window.submitQuiz = async function() {
    if (submitted) return;
    submitted = true;

    /* 採点 */
    let correct = 0;
    questions.forEach(q => {
      const userAns = answers[q.id];
      const isCorrect = userAns === q.correct;
      if (isCorrect) correct++;

      /* 正誤フィードバック表示 ②：正解に✅・不正解に❌アイコンを追加 */
      q.options.forEach((_, oi) => {
        const el = document.getElementById(`opt-${q.id}-${oi}`);
        if (!el) return;
        el.classList.remove('selected');
        if (oi === q.correct) {
          el.classList.add('correct');
          /* ②正解選択肢に「✅ 正解」ラベルを追加 */
          const badge = document.createElement('span');
          badge.textContent = '✅ 正解';
          badge.style.cssText = 'margin-left:auto;font-size:.72rem;font-weight:700;color:var(--green);flex-shrink:0';
          el.appendChild(badge);
        } else if (oi === userAns) {
          el.classList.add('wrong');
          const badge = document.createElement('span');
          badge.textContent = '❌ あなたの回答';
          badge.style.cssText = 'margin-left:auto;font-size:.72rem;font-weight:700;color:var(--red);flex-shrink:0';
          el.appendChild(badge);
        }
        el.style.pointerEvents = 'none';
      });

      /* 解説表示 */
      document.getElementById(`exp-${q.id}`)?.classList.add('show');
    });

    const score  = Math.round(correct / questions.length * 100);
    const passed = score >= course.passingScore;

    /* Firestore保存 */
    const attempts = await saveQuizResult(profile.uid, course.id, {
      score:   correct,
      total:   questions.length,
      passed,
      answers,
    });

    /* 合格なら受講完了 */
    if (passed) await completeCourse(profile.uid, course.id);

    /* ① 採点後ページトップへスクロール */
    window.scrollTo({ top: 0, behavior: 'smooth' });

    /* 採点ボタンを結果表示に変更 */
    document.getElementById('submitBtn').outerHTML = `
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <span style="font-size:.82rem;color:var(--muted)">
          ${passed ? `✅ ${score}点 合格` : `❌ ${score}点 不合格（合格基準${course.passingScore}点）`}
        </span>
        <button class="btn btn-primary" onclick="showResult(${correct}, ${questions.length}, ${score}, ${passed}, ${attempts})">
          結果を見る →
        </button>
      </div>
    `;
  };

  window.showResult = function(correct, total, score, passed, attempts) {
    /* 問題ごとの正誤サマリーHTML */
    const reviewHtml = questions.map((q, qi) => {
      const userAns   = answers[q.id];
      const isCorrect = userAns === q.correct;
      return `
      <div style="padding:12px 14px;border-radius:8px;margin-bottom:8px;background:${isCorrect ? '#f0fbf5' : '#fff5f5'};border:1px solid ${isCorrect ? '#bbf7d0' : '#fecaca'}">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:6px">
          <span style="font-size:1rem;flex-shrink:0">${isCorrect ? '✅' : '❌'}</span>
          <div style="font-size:.85rem;font-weight:700;line-height:1.5">問${qi + 1}. ${q.text}</div>
        </div>
        <div style="font-size:.8rem;margin-left:26px">
          <div style="margin-bottom:3px">
            あなたの回答：<span style="font-weight:700;color:${isCorrect ? 'var(--green)' : 'var(--red)'}">
              ${userAns !== undefined ? q.options[userAns] : '（未回答）'}
            </span>
          </div>
          ${!isCorrect ? `<div style="margin-bottom:6px">正解：<span style="font-weight:700;color:var(--green)">${q.options[q.correct]}</span></div>` : ''}
          <div style="color:var(--muted);line-height:1.6;background:rgba(0,0,0,.04);padding:8px 10px;border-radius:6px;margin-top:6px">
            💡 ${q.explanation}
          </div>
        </div>
      </div>`;
    }).join('');

    /* 修了証HTML（合格時のみ） */
    const certHtml = passed ? `
      <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border)">
        <div style="font-weight:700;margin-bottom:8px;font-size:.9rem">🏆 修了証</div>
        <p style="font-size:.82rem;color:var(--muted);margin-bottom:14px">
          修了証を発行できます。印刷またはPDFとして保存できます。
        </p>
        <div style="display:flex;justify-content:center">
          <a href="cert.html?courseId=${course.id}" class="btn btn-gold" target="_blank">
            🏆 修了証を発行する
          </a>
        </div>
      </div>` : '';

    document.getElementById('quizBody').innerHTML = `
      <div class="result-card au">
        <div class="result-icon">${passed ? '🎉' : '📚'}</div>
        <div class="result-title" style="color:${passed ? 'var(--green)' : 'var(--red)'}">
          ${passed ? '合格！おめでとうございます' : '不合格 — もう一度チャレンジしましょう'}
        </div>
        <div class="result-score">
          ${correct} <span style="font-size:1.5rem;color:var(--muted)">/ ${total}問正解</span>
        </div>
        <div style="margin-bottom:16px">
          <span class="badge ${passed ? 'badge-green' : 'badge-red'}" style="font-size:.9rem;padding:.4rem 1rem">
            ${score}点 ${passed ? '✅ 合格' : `（合格基準：${course.passingScore}点）`}
          </span>
        </div>
        <div class="result-desc">
          ${passed
            ? `素晴らしい結果です！この講座を修了しました。${attempts > 1 ? `（${attempts}回目での合格）` : ''}`
            : `合格基準は${course.passingScore}点です。講座を復習してから再チャレンジしてください。`}
        </div>
        <div class="result-actions" style="margin-bottom:28px">
          ${passed
            ? `<a href="dashboard.html" class="btn btn-gold">ダッシュボードに戻る</a>
               <a href="course.html?id=${course.id}" class="btn btn-ghost">講座を復習する</a>`
            : `<a href="course.html?id=${course.id}" class="btn btn-primary">講座を復習する</a>
               <a href="quiz.html?id=${course.id}" class="btn btn-ghost">再チャレンジ</a>
               <a href="dashboard.html" class="btn btn-ghost">ダッシュボードに戻る</a>`}
        </div>

        <!-- 問題ごとの正誤サマリー -->
        <div style="text-align:left;border-top:1px solid var(--border);padding-top:20px">
          <div style="font-weight:700;margin-bottom:14px;font-size:.9rem">📋 解答の確認</div>
          ${reviewHtml}
        </div>

        <!-- 修了証（合格時のみ） -->
        ${certHtml}
      </div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.doLogout = async function() {
    await logout();
    location.href = 'index.html';
  };

  init();
</script>

</body>
</html>
