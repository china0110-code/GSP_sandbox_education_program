<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI活用教育プログラム — ログイン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--ink);
    }

    .login-wrap {
      width: min(420px, 92vw);
      animation: fadeUp .5s ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-main {
      font-family: var(--ff-serif);
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--gold-lt);
      letter-spacing: .06em;
    }

    .login-logo-sub {
      font-size: .75rem;
      color: rgba(255,255,255,.4);
      margin-top: 4px;
      letter-spacing: .08em;
    }

    .login-card {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: 36px 40px 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
    }

    .login-title {
      font-family: var(--ff-serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
    }

    .login-reset {
      font-size: .78rem;
      color: rgba(255,255,255,.4);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      font-family: var(--ff-sans);
    }

    .login-reset:hover { color: var(--gold-lt); }

    .login-btn {
      width: 100%;
      justify-content: center;
      padding: 13px;
      font-size: .93rem;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-main">AI活用教育プログラム</div>
    <div class="login-logo-sub">AI-READY LEARNING PLATFORM</div>
  </div>

  <div class="login-card">
    <div class="login-title">ログイン</div>

    <div id="errMsg" class="err-msg"></div>

    <div class="fg">
      <label>メールアドレス</label>
      <input type="email" id="email" placeholder="example@company.com" autocomplete="email">
    </div>

    <div class="fg">
      <label>パスワード</label>
      <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password">
    </div>

    <button class="btn btn-primary login-btn" id="loginBtn" onclick="doLogin()">
      ログイン
    </button>
  </div>

  <div class="login-footer">
    <button class="login-reset" onclick="doReset()">パスワードをお忘れの方</button>
  </div>
</div>

<script type="module">
  import { login, sendReset } from "./auth.js";
  import { getMyProfile } from "./auth.js";

  function redirect(role) {
    window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
  }

  function showErr(msg) {
    const el = document.getElementById('errMsg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideErr() {
    document.getElementById('errMsg').classList.remove('show');
  }

  window.doLogin = async function () {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');

    hideErr();
    if (!email || !password) { showErr('メールアドレスとパスワードを入力してください。'); return; }

    btn.disabled = true;
    btn.textContent = 'ログイン中…';

    try {
      await login(email, password);
      /* ログイン成功後にプロフィール取得してリダイレクト */
      const profile = await getMyProfile();
      if (!profile || profile.deletedAt) {
        showErr('このアカウントは無効化されています。管理者にお問い合わせください。');
        btn.disabled = false;
        btn.textContent = 'ログイン';
        return;
      }
      redirect(profile.role);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'ログイン';
      const msg = e.code === 'auth/invalid-credential'
        ? 'メールアドレスまたはパスワードが正しくありません。'
        : 'ログインに失敗しました。しばらくしてから再試行してください。';
      showErr(msg);
    }
  };

  window.doReset = async function () {
    const email = document.getElementById('email').value.trim();
    if (!email) { showErr('メールアドレスを入力してください。'); return; }
    try {
      await sendReset(email);
      alert('パスワードリセットメールを送信しました。');
    } catch (e) {
      showErr('送信に失敗しました。メールアドレスを確認してください。');
    }
  };

  /* Enterキーでログイン */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') window.doLogin();
  });
</script>

</body>
</html>
